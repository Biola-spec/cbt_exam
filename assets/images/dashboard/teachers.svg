<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="te-bg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="te-head" cx="38%" cy="32%" r="68%"><stop stop-color="#8A96F0"/><stop offset="1" stop-color="#2F3DA8"/></radialGradient>
    <filter id="te-sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#2F3DA8" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="600" height="260" fill="url(#te-bg)"/>
  <ellipse cx="300" cy="228" rx="190" ry="14" fill="#2F3DA8" opacity=".1"/>
  <!-- isometric board -->
  <g filter="url(#te-sh)">
    <path d="M214 42 L402 42 L448 86 L260 86 Z" fill="#5C6BD6"/>
    <path d="M214 42 L260 86 L260 176 L214 132 Z" fill="#1A2468"/>
    <path d="M260 86 L448 86 L448 176 L260 176 Z" fill="#2F3DA8"/>
    <path d="M278 104 L430 104 L430 158 L278 158 Z" fill="#EEF2FF" opacity=".2"/>
    <path d="M292 118 h108" stroke="#7BE0F0" stroke-width="7" stroke-linecap="round"/>
    <path d="M292 136 h72" stroke="#6FDF7C" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- teacher: sphere + cone body -->
  <g filter="url(#te-sh)" transform="translate(78,70)">
    <circle cx="58" cy="46" r="36" fill="url(#te-head)"/>
    <ellipse cx="46" cy="34" rx="12" ry="7" fill="#fff" opacity=".32"/>
    <path d="M22 92 L58 78 L94 92 L94 168 L22 168 Z" fill="#24308A"/>
    <path d="M30 94 L58 82 L86 94 L86 164 L30 164 Z" fill="#3D4EC0"/>
    <ellipse cx="58" cy="168" rx="42" ry="10" fill="#2F3DA8" opacity=".16"/>
  </g>
  <!-- apple sphere -->
  <g transform="translate(470,92)">
    <ellipse cx="36" cy="108" rx="30" ry="8" fill="#2F3DA8" opacity=".12"/>
    <circle cx="36" cy="58" r="34" fill="#E23B2C"/>
    <ellipse cx="26" cy="44" rx="12" ry="7" fill="#fff" opacity=".3"/>
    <path d="M36 24 C40 8 56 10 54 24" stroke="#3D9B4A" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- pointer cylinder -->
  <g transform="translate(430,150) rotate(-28)">
    <rect x="0" y="0" width="86" height="12" rx="6" fill="#3DB8D8"/>
    <circle cx="86" cy="6" r="8" fill="#2F3DA8"/>
  </g>
</svg>
