<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="su-bg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="su-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2F3DA8" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="600" height="260" fill="url(#su-bg)"/>
  <ellipse cx="300" cy="230" rx="200" ry="14" fill="#2F3DA8" opacity=".1"/>
  <!-- stacked isometric books -->
  <g filter="url(#su-sh)">
    <!-- bottom blue -->
    <path d="M168 148 L432 148 L468 178 L204 178 Z" fill="#5C6BD6"/>
    <path d="M168 148 L204 178 L204 206 L168 176 Z" fill="#1A2468"/>
    <path d="M204 178 L468 178 L468 206 L204 206 Z" fill="#2F3DA8"/>
    <!-- middle cyan -->
    <path d="M180 112 L420 112 L452 140 L212 140 Z" fill="#7BE0F0"/>
    <path d="M180 112 L212 140 L212 168 L180 140 Z" fill="#167A94"/>
    <path d="M212 140 L452 140 L452 168 L212 168 Z" fill="#3DB8D8"/>
    <!-- top green -->
    <path d="M196 76 L404 76 L432 102 L224 102 Z" fill="#6FDF7C"/>
    <path d="M196 76 L224 102 L224 130 L196 104 Z" fill="#2E7D32"/>
    <path d="M224 102 L432 102 L432 130 L224 130 Z" fill="#3D9B4A"/>
  </g>
  <!-- red book standing -->
  <g filter="url(#su-sh)" transform="translate(470,78)">
    <path d="M18 8 L78 38 L78 168 L18 138 Z" fill="#E23B2C"/>
    <path d="M8 20 L18 8 L18 138 L8 150 Z" fill="#A31F1F"/>
    <path d="M8 20 L68 50 L78 38 L18 8 Z" fill="#FF8B80"/>
    <path d="M32 48 L68 66" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".45"/>
    <path d="M32 68 L62 84" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  </g>
  <!-- small sphere -->
  <circle cx="128" cy="92" r="28" fill="#2F3DA8"/>
  <ellipse cx="118" cy="82" rx="10" ry="6" fill="#fff" opacity=".3"/>
</svg>
