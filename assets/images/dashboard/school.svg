<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="sc-dome" cx="40%" cy="30%" r="70%"><stop stop-color="#8A96F0"/><stop offset="1" stop-color="#2F3DA8"/></radialGradient>
    <filter id="sc-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2F3DA8" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="600" height="260" fill="url(#sc-bg)"/>
  <ellipse cx="300" cy="232" rx="210" ry="14" fill="#2F3DA8" opacity=".1"/>
  <g filter="url(#sc-sh)">
    <!-- roof prism -->
    <path d="M300 28 L470 92 L300 132 L130 92 Z" fill="#5C6BD6"/>
    <path d="M130 92 L300 132 L300 152 L130 112 Z" fill="#1A2468"/>
    <path d="M300 132 L470 92 L470 112 L300 152 Z" fill="#2F3DA8"/>
    <!-- building body -->
    <path d="M168 128 L300 176 L300 228 L168 180 Z" fill="#EEF2FF"/>
    <path d="M300 176 L432 128 L432 180 L300 228 Z" fill="#C9D0F5"/>
    <!-- windows cubes -->
    <path d="M206 148 L238 160 L238 182 L206 170 Z" fill="#3DB8D8"/>
    <path d="M250 164 L282 176 L282 198 L250 186 Z" fill="#2F3DA8"/>
    <path d="M318 164 L350 152 L350 174 L318 186 Z" fill="#3D9B4A"/>
    <path d="M362 148 L394 136 L394 158 L362 170 Z" fill="#E23B2C"/>
    <!-- door -->
    <path d="M282 198 L318 186 L318 220 L282 228 Z" fill="#24308A"/>
  </g>
  <!-- dome sphere -->
  <g transform="translate(262,8)">
    <ellipse cx="38" cy="46" rx="38" ry="18" fill="url(#sc-dome)"/>
    <circle cx="38" cy="18" r="8" fill="#E23B2C"/>
  </g>
  <!-- side cubes -->
  <g transform="translate(52,128)">
    <path d="M48 8 L96 32 L48 56 L0 32 Z" fill="#6FDF7C"/>
    <path d="M0 32 L48 56 L48 92 L0 68 Z" fill="#2E7D32"/>
    <path d="M48 56 L96 32 L96 68 L48 92 Z" fill="#3D9B4A"/>
  </g>
  <g transform="translate(456,128)">
    <path d="M48 8 L96 32 L48 56 L0 32 Z" fill="#FF8B80"/>
    <path d="M0 32 L48 56 L48 92 L0 68 Z" fill="#A31F1F"/>
    <path d="M48 56 L96 32 L96 68 L48 92 Z" fill="#E23B2C"/>
  </g>
</svg>
